<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Survival On Space</title>
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
  <div class="app-shell">
    <header class="hud-header" id="hud-bar" aria-label="Stato del personaggio"></header>

    <main class="tab-viewport" id="tab-content" aria-live="polite"></main>

    <nav class="tab-bar" id="tab-bar" aria-label="Navigazione principale">
      <button type="button" class="tab-btn" data-tab="map">🗺️ Mappa</button>
      <button type="button" class="tab-btn" data-tab="mission">🎯 Missione</button>
      <button type="button" class="tab-btn" data-tab="ship">🚀 Nave Spaziale</button>
      <button type="button" class="tab-btn" data-tab="options">⚙️ Opzioni</button>
    </nav>
  </div>

  <div class="modal-backdrop hidden" id="modal-root" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title">Dettagli</h2>
        <button type="button" class="btn btn-ghost btn-sm" id="modal-close-btn" aria-label="Chiudi finestra">Chiudi</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div class="toast-container" id="toast-root" aria-live="assertive"></div>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
